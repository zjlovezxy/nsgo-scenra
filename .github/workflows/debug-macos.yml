name: Debug macOS

on:
  push:
    branches: [debug-macos]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    if: ${{ !contains(github.event.head_commit.message, 'skip-ci') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build both apps
        run: |
          go tool nsgo build -target macos_arm64 -version 0.2.0-debug cmd/scenra
          git worktree add ../base b172ff6
          (cd ../base && go tool nsgo build -target macos_arm64 -version 0.1.1-base cmd/scenra)
      - name: Probe
        run: |
          set -u
          MINE=$(find cmd/scenra/dist -name 'Scenra.app' -path '*0.2.0-debug*' | head -1)
          BASE=$(find ../base/cmd/scenra/dist -name 'Scenra.app' | head -1)
          echo "MINE=$MINE" > /tmp/probe.txt
          echo "BASE=$BASE" >> /tmp/probe.txt
          run() { "$1/Contents/MacOS/Scenra" > /tmp/app-$2.log 2>&1 & echo $!; }
          shot() { screencapture -x "/tmp/$1.png" >/dev/null 2>&1; }
          pid=$(run "$MINE" mine); sleep 12; shot mine-fresh
          kill $pid 2>/dev/null || true; sleep 2
          echo "## storage files" >> /tmp/probe.txt
          find "$HOME/Library" -iname '*nsgo-scenra*' -maxdepth 6 2>/dev/null >> /tmp/probe.txt
          defaults export me.oneo.nsgo-scenra - 2>/dev/null >> /tmp/probe.txt || echo "no defaults" >> /tmp/probe.txt
          STORE="$HOME/Library/Application Support/me.oneo.nsgo-scenra/storage.json"
          python3 - "$STORE" "$PWD/examples/coffee-shop" <<'PY' >> /tmp/probe.txt 2>&1
          import json, os, sys
          store, folder = sys.argv[1], sys.argv[2]
          print("seeding", store, "exists", os.path.exists(store))
          d = {}
          if os.path.exists(store):
              d = json.load(open(store))
          d["tabs"] = json.dumps([{"folder": folder}])
          d["tabs.shown"] = folder
          os.makedirs(os.path.dirname(store), exist_ok=True)
          json.dump(d, open(store, "w"))
          print("seeded", open(store).read()[:200])
          PY
          pid=$(run "$MINE" mine2); sleep 14; shot mine-tab
          echo "## windows with a tab (mine)" >> /tmp/probe.txt
          osascript -e 'tell application "System Events" to tell process "Scenra" to get name of every window' >> /tmp/probe.txt 2>&1 || true
          kill $pid 2>/dev/null || true; sleep 2
          pid=$(run "$BASE" base); sleep 14; shot base-tab
          echo "## windows with a tab (base)" >> /tmp/probe.txt
          osascript -e 'tell application "System Events" to tell process "Scenra" to get name of every window' >> /tmp/probe.txt 2>&1 || true
          echo "## base log" >> /tmp/probe.txt
          cat /tmp/app-base.log >> /tmp/probe.txt
          echo "## mine log" >> /tmp/probe.txt
          cat /tmp/app-mine2.log >> /tmp/probe.txt
          kill $pid 2>/dev/null || true
      - name: Publish
        if: always()
        run: |
          mkdir -p diag
          cp /tmp/*.png diag/ 2>/dev/null || true
          cp /tmp/probe.txt diag/ 2>/dev/null || true
          git config user.email dev@local && git config user.name dev
          git add -f diag && git commit -m "diag: tabs on the mac [skip-ci]" && git push
