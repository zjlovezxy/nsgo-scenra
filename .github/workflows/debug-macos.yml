name: Debug macOS

on:
  push:
    branches: [debug-macos]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    if: ${{ !contains(github.event.head_commit.message, 'skip-ci') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the mac app
        run: go tool nsgo build -target macos_arm64 -version 0.2.0-debug cmd/scenra
      - name: Launch and probe
        run: |
          APP=$(find cmd/scenra/dist -name 'Scenra.app' -maxdepth 3 | head -1)
          BIN="$APP/Contents/MacOS/Scenra"
          echo "APP=$APP"
          "$BIN" > /tmp/app.log 2>&1 &
          sleep 20
          {
            echo "## ps"
            ps -eo pid,stat,etime,command | grep -i "[S]cenra"
            echo
            echo "## frontmost processes"
            osascript -e 'tell application "System Events" to get name of every process' 2>&1 | tr ',' '\n' | grep -i scenra || echo none
            echo
            echo "## windows"
            osascript -e 'tell application "System Events" to tell process "Scenra" to get name of every window' 2>&1 || true
            echo
            echo "## app log"
            cat /tmp/app.log || true
          } > /tmp/probe.txt 2>&1
          screencapture -x /tmp/shot.png 2>&1 || true
          convert=/usr/bin/sips
          $convert -g pixelWidth -g pixelHeight /tmp/shot.png >> /tmp/probe.txt 2>&1 || true
          PID=$(pgrep -f 'MacOS/Scenra' | head -1)
          echo "PID=$PID" >> /tmp/probe.txt
          if [ -n "$PID" ]; then
            sample "$PID" 3 -file /tmp/sample.txt >/dev/null 2>&1 || true
            echo "## sample" >> /tmp/probe.txt
            head -120 /tmp/sample.txt >> /tmp/probe.txt || true
          fi
          # The app must also quit when asked.
          osascript -e 'tell application "Scenra" to quit' >/tmp/quit.txt 2>&1 || true
          sleep 5
          echo "## after quit" >> /tmp/probe.txt
          ps -eo pid,command | grep -i "[S]cenra" >> /tmp/probe.txt || echo "gone" >> /tmp/probe.txt
          cat /tmp/quit.txt >> /tmp/probe.txt
      - name: Publish the diagnostics
        if: always()
        run: |
          mkdir -p diag
          cp /tmp/probe.txt diag/probe.txt 2>/dev/null || true
          cp /tmp/shot.png diag/shot.png 2>/dev/null || true
          git config user.email dev@local && git config user.name dev
          git add -f diag && git commit -m "diag: probe the mac app [skip-ci]" && git push
